name: CI

on:
  push:
    branches: [master, main, feature/windows-installer]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            nlohmann-json3-dev

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build

      - name: Test (Release)
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            nlohmann-json3-dev

      - name: Configure (ASan/UBSan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DPLUMAS_ENABLE_SANITIZERS=ON

      - name: Build (ASan/UBSan)
        run: cmake --build build-asan

      - name: Test (ASan/UBSan)
        run: ctest --test-dir build-asan --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            nlohmann-json3-dev

      - name: Build fuzzers
        run: |
          CC=clang CXX=clang++ cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DPLUMAS_BUILD_FUZZERS=ON
          cmake --build build-fuzz --target fuzz_text fuzz_config

      # A short smoke run per push; longer campaigns are run locally.
      - name: Fuzz (60 s each)
        run: |
          mkdir -p corpus-text corpus-config
          ./build-fuzz/fuzz_text -max_total_time=60 -max_len=4096 corpus-text
          ./build-fuzz/fuzz_config -max_total_time=60 -max_len=4096 corpus-config

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          # The packages below are UCRT64 builds; the default MINGW64 shell
          # would not have /ucrt64/bin on PATH.
          msystem: UCRT64
          location: D:\a\_temp\msys64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-python

      - name: Configure (Release)
        run: cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build-win

      - name: Test (Release)
        run: ctest --test-dir build-win --output-on-failure
